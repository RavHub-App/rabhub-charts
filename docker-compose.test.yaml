version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ravhub
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ravhub
    tmpfs:
      - /var/lib/postgresql/data # Faster, transient data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ravhub"]
      interval: 2s
      timeout: 5s
      retries: 10

  ravhub:
    image: ${RAVHUB_IMAGE:-ravhub:community}
    ports:
      - "3000:3000"
      - "8080:80"  # Map host 8080 to container 80 (frontend)
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ravhub
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=ravhub
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=ravhub
      - DB_PASSWORD=password
      - DB_DATABASE=ravhub
      - JWT_SECRET=test-secret
      - STORAGE_TYPE=local
      - STORAGE_PATH=/data/storage
      - RAVHUB_EDITION=${RAVHUB_EDITION:-community}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - test-storage:/data/storage
      - ./test-logs:/var/log/nginx

volumes:
  test-storage:
